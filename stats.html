<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Penguin Armies: The Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css"> 
    <link id="archiveMapCss" rel="stylesheet" href="map.css">

    <script src="https://code.highcharts.com/maps/highmaps.js"></script>

    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0, 243, 255, 0.1);
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-val { font-size: 1.8em; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        .stat-label { font-size: 0.8em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        select.archive-selector {
            background: #051020;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 8px 15px;
            font-family: 'Rajdhani';
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-container { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { 
            background: #051020; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 5px 10px; cursor: pointer; font-family: 'Rajdhani'; font-size: 0.7em;
        }
        .tab-btn.active { background: var(--neon-blue); color: #000; }

        .highcharts-container, .highcharts-root { background: transparent !important; }
        
        #sidebarFrame { width: 100%; flex: 1; border: none; min-height: 0; }
        
        #container {
            width: 70%;
            height: 500px;
            margin: 0 auto;
            border: 0px solid rgba(255,255,255,0.05);
        }

        .weapons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .weapon-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 0, 85, 0.15);
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }
        .weapon-icon { font-size: 1.6em; }
        .weapon-count { font-size: 1.4em; font-weight: bold; color: #ff0055; }
        .weapon-label { font-size: 0.75em; color: var(--text-muted); text-transform: uppercase; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="logo-section">
            <h1>CPA: THE MAP <span style="font-size:0.5em; color:var(--text-muted); vertical-align: super;">ARCHIVES</span></h1>
        </div>
        <div class="nav-links">
            <a href="index.html">Live Map</a>
            <a href="#" class="active">Archives</a>
            <a href="https://discord.gg/cparmies" target="_blank">Discord</a>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div style="padding-bottom:15px; border-bottom:1px solid var(--border-color); margin-bottom:15px;">
                <h2 style="margin:0; border:none;">Select Date</h2>
                <select id="weekSelector" class="archive-selector" onchange="loadWeekData(this.value)" style="width:100%">
                    <option>Loading...</option>
                </select>
            </div>
            
            <div class="tab-container">
                <button class="tab-btn active" onclick="switchTab('topten')">TOP 10</button>
                <button class="tab-btn" onclick="switchTab('forces')">FORCES</button>
                <button class="tab-btn" onclick="switchTab('wealth')">WEALTH</button>
            </div>
            
            <div style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
                <iframe id="sidebarFrame" src=""></iframe>
            </div>
            
            <div style="margin-top:20px; padding-top:10px; border-top:1px solid var(--border-color);">
                <div style="font-size:0.8em; color:var(--text-muted); text-transform:uppercase;">Top Warmonger</div>
                <div id="warmongerName" style="font-size:1.4em; font-weight:bold; color:#ff0055;">-</div>
                <div id="warmongerCount" style="color:#fff;">0 Attacks</div>
            </div>
        </aside>

        <div class="map-wrapper" style="display:block; overflow-y:hidden;">
            
            <div class="map-header">
                <span class="status-indicator">
                    <div class="status-dot" style="background:var(--neon-blue); box-shadow:0 0 8px var(--neon-blue);"></div> 
                    ARCHIVED DATA: <span id="archiveDate" style="color:#fff; margin-left:5px;">-</span>
                </span>
            </div>

            <div style="padding:20px;">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-val" id="totalForces">0</div>
                        <div class="stat-label">Active Forces</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalAttacks">0</div>
                        <div class="stat-label">Max Attacks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalWars">0</div>
                        <div class="stat-label">Active Wars</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalWeapons">0</div>
                        <div class="stat-label">Weapons Used</div>
                    </div>
                </div>

                <h3 style="color:var(--neon-blue); text-transform:uppercase; border-bottom:1px solid var(--border-color); padding-bottom:10px;">Monthly Weapon Usage</h3>
                <div id="weaponsGrid" class="weapons-grid"></div>

                <h3 style="color:var(--neon-blue); text-transform:uppercase; border-bottom:1px solid var(--border-color); padding-bottom:10px;">Territory Snapshot</h3>
                
                <div id="container"></div>
                <div id="loadingMsg" style="display:none; text-align:center; color:#0ff; padding:20px;">LOADING MAP...</div>
            </div>

        </div>

    </div>

    <div class="footer-text" style="text-align:center; padding: 10px; color: #555; font-size: 0.8rem;">
        UI by df44 for CPA
    </div>

    <script>
        let historyData = [];
        let currentBasePath = "";

        window.onload = async function() {
            try {
                const response = await fetch('history.json');
                if (!response.ok) throw new Error("History file not found");
                historyData = await response.json();

                const selector = document.getElementById('weekSelector');
                selector.innerHTML = "";
                
                if (historyData.length === 0) {
                    selector.innerHTML = "<option>No Archives Found</option>";
                    return;
                }

                historyData.forEach((week, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.innerText = `${week.id}`;
                    selector.appendChild(opt);
                });

                loadWeekData(0);

            } catch (e) {
                console.error(e);
                document.querySelector('.dashboard-container').innerHTML = 
                    `<div style="width:100%; text-align:center; padding-top:100px; color:#ff0055;">
                        <h2>ARCHIVE OFFLINE</h2>
                        <p>No history data generated yet.</p>
                    </div>`;
            }
        };

        function loadWeekData(index) {
            const week = historyData[index];
            const stats = week.stats || {};
            const monthly = week.monthly_items || {};

            // Define base path for archived files
            currentBasePath = week.folder || `archives/${week.date}`;

            // 1. Header & Stats
            document.getElementById('archiveDate').innerText = week.date || '?';

            const forcesCount = (week.active_forces || []).reduce((sum, f) => sum + (f.servers || 0), 0);
            document.getElementById('totalForces').innerText = forcesCount;
            document.getElementById('totalAttacks').innerText = stats.attacks || 0;
            document.getElementById('totalWars').innerText = stats.wars || 0;

            const totalWeapons = (monthly.bomb_used || 0) + (monthly.nuke_used || 0) + (monthly.ship_used || 0) + (monthly.plane_used || 0);
            document.getElementById('totalWeapons').innerText = totalWeapons;

            // 2. Weapons grid
            const weaponsGrid = document.getElementById('weaponsGrid');
            weaponsGrid.innerHTML = "";
            const weaponData = [
                { icon: "💣", label: "Bombs", count: monthly.bomb_used || 0 },
                { icon: "☢️", label: "Nukes", count: monthly.nuke_used || 0 },
                { icon: "🚢", label: "Ships", count: monthly.ship_used || 0 },
                { icon: "✈️", label: "Planes", count: monthly.plane_used || 0 }
            ];
            weaponData.forEach(w => {
                const card = document.createElement('div');
                card.className = "weapon-card";
                card.innerHTML = `
                    <div class="weapon-icon">${w.icon}</div>
                    <div class="weapon-count">${w.count}</div>
                    <div class="weapon-label">${w.label}</div>
                `;
                weaponsGrid.appendChild(card);
            });

            // 3. Warmonger
            document.getElementById('warmongerName').innerText = stats.warmonger_name || '-';
            document.getElementById('warmongerCount').innerText = `${stats.warmonger_count || 0} Attacks`;

            // 4. Update the active tab (iframe)
            const activeBtn = document.querySelector('.tab-btn.active');
            if (activeBtn) activeBtn.click();
            else switchTab('topten');

            // 5. Load the ARCHIVED MAP
            loadArchiveMap(currentBasePath);
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const clickedBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => 
                b.innerText.toLowerCase().includes(tabName.replace('topten', 'top 10'))
            );
            if (clickedBtn) clickedBtn.classList.add('active');

            const iframe = document.getElementById('sidebarFrame');
            if (tabName === 'topten') iframe.src = `${currentBasePath}/topten.html`;
            if (tabName === 'forces') iframe.src = `${currentBasePath}/army_code.html`;
            if (tabName === 'wealth') iframe.src = `${currentBasePath}/wealth.html`;
        }

        // Load Archived Highcharts Map
        function loadArchiveMap(basePath) {
            const container = document.getElementById('container');
            const loader = document.getElementById('loadingMsg');
            
            if (Highcharts.charts[0]) { Highcharts.charts[0].destroy(); }
            container.innerHTML = "";
            loader.style.display = 'block';

            // Update map CSS to archived version
            document.getElementById('archiveMapCss').href = `${basePath}/map.css?t=${Date.now()}`;

            // Remove old dynamic script
            const oldScript = document.getElementById('dynamicMapScript');
            if (oldScript) oldScript.remove();

            // Inject archived map.js
            const script = document.createElement('script');
            script.id = 'dynamicMapScript';
            script.src = `${basePath}/map.js?t=${Date.now()}`;
            
            script.onload = () => { loader.style.display = 'none'; };
            script.onerror = () => { 
                loader.style.display = 'none'; 
                container.innerHTML = "<div style='text-align:center; color:#ff0055; padding:40px;'>Map data not available for this archive.</div>";
            };

            document.body.appendChild(script);
        }
    </script>
</body>
</html>
