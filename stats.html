<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Penguin Armies: The Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="map.css">

    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0, 243, 255, 0.1);
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-val { font-size: 1.8em; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        .stat-label { font-size: 0.8em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .archive-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
        }

        select.archive-selector {
            background: #051020;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 8px 15px;
            font-family: 'Rajdhani';
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
        }

        .lb-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }
        .lb-rank { color: var(--neon-blue); font-weight: bold; width: 30px; }
        .lb-name { flex: 1; font-weight: 600; }
        .lb-val { font-family: monospace; letter-spacing: 1px; }
        
        .val-points { color: #ffd700; text-shadow: 0 0 5px #ffd700; }
        .val-balance { color: #00ff9d; }
        .val-servers { color: #00bfff; }

        .snapshot-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 20px;
            justify-content: center;
            overflow-y: auto;
            max-height: 400px;
        }
        
        .snap-dot {
            width: 14px;
            height: 14px;
            background: #222;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: help;
        }
        .snap-dot:hover {
            transform: scale(1.5);
            border-color: #fff;
            z-index: 10;
        }

        .weapons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .weapon-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 0, 85, 0.15);
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }
        .weapon-icon { font-size: 1.6em; }
        .weapon-count { font-size: 1.4em; font-weight: bold; color: #ff0055; }
        .weapon-label { font-size: 0.75em; color: var(--text-muted); text-transform: uppercase; }

        .section-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .section-tab {
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-muted);
            font-family: 'Rajdhani';
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .section-tab:hover { color: #fff; }
        .section-tab.active { color: var(--neon-blue); border-bottom-color: var(--neon-blue); }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="logo-section">
            <h1>CPA: THE MAP <span style="font-size:0.5em; color:var(--text-muted); vertical-align: super;">ARCHIVES</span></h1>
        </div>
        <div class="nav-links">
            <a href="index.html">Live Map</a>
            <a href="#" class="active">Archives</a>
            <a href="https://discord.gg/cparmies" target="_blank">Discord</a>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div style="padding-bottom:15px; border-bottom:1px solid var(--border-color); margin-bottom:15px;">
                <h2 style="margin:0; border:none;">Select Date</h2>
                <select id="weekSelector" class="archive-selector" onchange="loadWeekData(this.value)" style="width:100%">
                    <option>Loading...</option>
                </select>
            </div>

            <h2 id="lbTitle">Rankings</h2>
            <div id="leaderboardList" style="flex:1; overflow-y:auto;"></div>
            
            <div style="margin-top:20px; padding-top:10px; border-top:1px solid var(--border-color);">
                <div style="font-size:0.8em; color:var(--text-muted); text-transform:uppercase;">Top Warmonger</div>
                <div id="warmongerName" style="font-size:1.4em; font-weight:bold; color:#ff0055;">-</div>
                <div id="warmongerCount" style="color:#fff;">0 Attacks</div>
            </div>
        </aside>

        <div class="map-wrapper" style="display:block; overflow-y:auto;">
            
            <div class="map-header">
                <span class="status-indicator">
                    <div class="status-dot" style="background:var(--neon-blue); box-shadow:0 0 8px var(--neon-blue);"></div> 
                    ARCHIVED DATA: <span id="archiveDate" style="color:#fff; margin-left:5px;">-</span>
                </span>
            </div>

            <div style="padding:20px;">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-val" id="totalForces">0</div>
                        <div class="stat-label">Active Forces</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalAttacks">0</div>
                        <div class="stat-label">Max Attacks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalWars">0</div>
                        <div class="stat-label">Active Wars</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalWeapons">0</div>
                        <div class="stat-label">Weapons Used</div>
                    </div>
                </div>

                <h3 style="color:var(--neon-blue); text-transform:uppercase; border-bottom:1px solid var(--border-color); padding-bottom:10px;">Monthly Weapon Usage</h3>
                <div id="weaponsGrid" class="weapons-grid"></div>

                <h3 style="color:var(--neon-blue); text-transform:uppercase; border-bottom:1px solid var(--border-color); padding-bottom:10px;">Territory Snapshot</h3>
                <div id="mapSnapshot" class="snapshot-grid"></div>
            </div>

        </div>

    </div>

    <div class="footer-text" style="text-align:center; padding: 10px; color: #555; font-size: 0.8rem;">
        UI by df44 for CPA
    </div>

    <script>
        let historyData = [];
        let currentLbTab = 'top_ten';

        window.onload = async function() {
            try {
                const response = await fetch('history.json');
                if (!response.ok) throw new Error("History file not found");
                historyData = await response.json();

                const selector = document.getElementById('weekSelector');
                selector.innerHTML = "";
                
                if (historyData.length === 0) {
                    selector.innerHTML = "<option>No Archives Found</option>";
                    return;
                }

                historyData.forEach((week, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.innerText = `${week.id} (${week.date})`;
                    selector.appendChild(opt);
                });

                loadWeekData(0);

            } catch (e) {
                console.error(e);
                document.querySelector('.dashboard-container').innerHTML = 
                    `<div style="width:100%; text-align:center; padding-top:100px; color:#ff0055;">
                        <h2>ARCHIVE OFFLINE</h2>
                        <p>No history data generated yet.</p>
                    </div>`;
            }
        };

        function loadWeekData(index) {
            const week = historyData[index];
            const stats = week.stats || {};

            // Header
            document.getElementById('archiveDate').innerText = week.date || '?';

            // Stat cards
            const forcesCount = (week.active_forces || []).reduce((sum, f) => sum + (f.servers || 0), 0);
            document.getElementById('totalForces').innerText = forcesCount;
            document.getElementById('totalAttacks').innerText = stats.attacks || 0;
            document.getElementById('totalWars').innerText = stats.wars || 0;

            const monthly = week.monthly_items || {};
            const totalWeapons = (monthly.bomb_used || 0) + (monthly.nuke_used || 0) + (monthly.ship_used || 0) + (monthly.plane_used || 0);
            document.getElementById('totalWeapons').innerText = totalWeapons;

            // Weapons grid
            const weaponsGrid = document.getElementById('weaponsGrid');
            weaponsGrid.innerHTML = "";
            const weaponData = [
                { icon: "💣", label: "Bombs", count: monthly.bomb_used || 0 },
                { icon: "☢️", label: "Nukes", count: monthly.nuke_used || 0 },
                { icon: "🚢", label: "Ships", count: monthly.ship_used || 0 },
                { icon: "✈️", label: "Planes", count: monthly.plane_used || 0 }
            ];
            weaponData.forEach(w => {
                const card = document.createElement('div');
                card.className = "weapon-card";
                card.innerHTML = `
                    <div class="weapon-icon">${w.icon}</div>
                    <div class="weapon-count">${w.count}</div>
                    <div class="weapon-label">${w.label}</div>
                `;
                weaponsGrid.appendChild(card);
            });

            // Warmonger
            document.getElementById('warmongerName').innerText = stats.warmonger_name || '-';
            document.getElementById('warmongerCount').innerText = `${stats.warmonger_count || 0} Attacks`;

            // Leaderboard — render both tabs if data exists
            renderLeaderboard(week);
            createLbTabs(week);

            // Map Snapshot
            const mapContainer = document.getElementById('mapSnapshot');
            mapContainer.innerHTML = "";
            
            const snapshot = week.map_snapshot || {};
            const sortedServers = Object.keys(snapshot).sort();
            sortedServers.forEach(serverName => {
                const owner = snapshot[serverName];
                let color = stringToColor(owner);
                if (owner === "Freeland") color = "#222"; 
                if (owner === "None" || owner === "Locked Land") color = "#111";

                const dot = document.createElement('div');
                dot.className = "snap-dot";
                dot.style.backgroundColor = color;
                dot.title = `${serverName}: ${owner}`;
                mapContainer.appendChild(dot);
            });
        }

        function createLbTabs(week) {
            const hasTopTen = week.top_ten && week.top_ten.length > 0;
            const hasWealth = week.wealth && week.wealth.length > 0;
            const hasForces = week.active_forces && week.active_forces.length > 0;

            // Remove old tabs
            const oldTabs = document.querySelector('.section-tabs');
            if (oldTabs) oldTabs.remove();

            if (!hasTopTen && !hasWealth && !hasForces) return;

            const tabsContainer = document.createElement('div');
            tabsContainer.className = "section-tabs";

            if (hasTopTen) {
                const tab = document.createElement('div');
                tab.className = "section-tab" + (currentLbTab === 'top_ten' ? ' active' : '');
                tab.innerText = "🏆 Top 10";
                tab.onclick = () => { currentLbTab = 'top_ten'; renderLeaderboard(week); updateTabStyles(tabsContainer); };
                tabsContainer.appendChild(tab);
            }
            if (hasWealth) {
                const tab = document.createElement('div');
                tab.className = "section-tab" + (currentLbTab === 'wealth' ? ' active' : '');
                tab.innerText = "💰 Wealth";
                tab.onclick = () => { currentLbTab = 'wealth'; renderLeaderboard(week); updateTabStyles(tabsContainer); };
                tabsContainer.appendChild(tab);
            }
            if (hasForces) {
                const tab = document.createElement('div');
                tab.className = "section-tab" + (currentLbTab === 'forces' ? ' active' : '');
                tab.innerText = "⚔️ Forces";
                tab.onclick = () => { currentLbTab = 'forces'; renderLeaderboard(week); updateTabStyles(tabsContainer); };
                tabsContainer.appendChild(tab);
            }

            // Insert tabs before the leaderboard list
            const lbList = document.getElementById('leaderboardList');
            lbList.parentNode.insertBefore(tabsContainer, lbList);
        }

        function updateTabStyles(container) {
            container.querySelectorAll('.section-tab').forEach(tab => {
                tab.classList.remove('active');
                if (
                    (currentLbTab === 'top_ten' && tab.innerText.includes('Top 10')) ||
                    (currentLbTab === 'wealth' && tab.innerText.includes('Wealth')) ||
                    (currentLbTab === 'forces' && tab.innerText.includes('Forces'))
                ) {
                    tab.classList.add('active');
                }
            });
        }

        function renderLeaderboard(week) {
            const lbContainer = document.getElementById('leaderboardList');
            const lbTitle = document.getElementById('lbTitle');
            lbContainer.innerHTML = "";

            if (currentLbTab === 'top_ten' && week.top_ten && week.top_ten.length > 0) {
                lbTitle.innerText = "🏆 Top 10 Rankings";
                week.top_ten.forEach((entry, i) => {
                    const row = document.createElement('div');
                    row.className = "lb-row";
                    row.innerHTML = `
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="lb-rank">#${entry.rank || (i+1)}</span>
                            <span class="lb-name">${entry.name}</span>
                        </div>
                        <span class="lb-val val-points">${entry.points} PTS</span>
                    `;
                    lbContainer.appendChild(row);
                });

            } else if (currentLbTab === 'wealth' && week.wealth && week.wealth.length > 0) {
                lbTitle.innerText = "💰 Wealth Leaderboard";
                week.wealth.forEach((entry, i) => {
                    const row = document.createElement('div');
                    row.className = "lb-row";
                    row.innerHTML = `
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="lb-rank">#${i+1}</span>
                            <span class="lb-name">${entry.name}</span>
                        </div>
                        <span class="lb-val val-balance">$${formatMoney(entry.balance)}</span>
                    `;
                    lbContainer.appendChild(row);
                });

            } else if (currentLbTab === 'forces' && week.active_forces && week.active_forces.length > 0) {
                lbTitle.innerText = "⚔️ Active Forces";
                week.active_forces.forEach((entry, i) => {
                    const row = document.createElement('div');
                    row.className = "lb-row";
                    row.innerHTML = `
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="lb-rank">#${i+1}</span>
                            <span class="lb-name">${entry.name}</span>
                        </div>
                        <span class="lb-val val-servers">${entry.servers} servers</span>
                    `;
                    lbContainer.appendChild(row);
                });

            } else {
                lbTitle.innerText = "Rankings";
                lbContainer.innerHTML = "<div style='color:var(--text-muted); padding:20px; text-align:center;'>No data for this archive.</div>";
            }
        }

        function formatMoney(amount) {
            if (!amount) return "0";
            if (amount >= 1000000) return (amount / 1000000).toFixed(1) + 'M';
            if (amount >= 1000) return (amount / 1000).toFixed(1) + 'k';
            return amount.toLocaleString('en-US');
        }

        function stringToColor(str) {
            if (!str) return "#333";
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            let color = '#';
            for (let i = 0; i < 3; i++) {
                let value = (hash >> (i * 8)) & 0xFF;
                color += ('00' + value.toString(16)).substr(-2);
            }
            return color;
        }
    </script>
</body>
</html>
