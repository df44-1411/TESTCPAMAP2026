<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Penguin Armies: The Archive</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css"> 
    <link id="archiveMapCss" rel="stylesheet" href="map.css">

    <script src="https://code.highcharts.com/maps/highmaps.js"></script>

    <style>
        /* --- LEFT PANEL --- */
        .archive-left-panel {
            flex: 0 0 320px;
            min-width: 280px;
            max-width: 360px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .archive-left-panel::-webkit-scrollbar { width: 6px; }
        .archive-left-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .archive-left-panel::-webkit-scrollbar-thumb { background: #1c3d5e; border-radius: 3px; }

        /* --- RIGHT PANEL (MAP) --- */
        .archive-right-panel {
            flex: 1;
            background: var(--bg-mapp);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- STATS GRID (compact horizontal) --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .stat-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0, 243, 255, 0.1);
            padding: 10px 8px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-val { font-size: 1.4em; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        .stat-label { font-size: 0.65em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* --- WEAPONS GRID (compact) --- */
        .weapons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .weapon-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 0, 85, 0.15);
            padding: 8px 4px;
            border-radius: 4px;
            text-align: center;
        }
        .weapon-icon { font-size: 1.2em; }
        .weapon-count { font-size: 1.1em; font-weight: bold; color: #ff0055; }
        .weapon-label { font-size: 0.6em; color: var(--text-muted); text-transform: uppercase; }

        /* --- SECTION DIVIDER --- */
        .panel-section-title {
            color: var(--neon-blue);
            text-transform: uppercase;
            font-size: 0.75em;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        select.archive-selector {
            background: #051020;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 8px 15px;
            font-family: 'Rajdhani';
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.85em;
        }

        .tab-container { display: flex; gap: 5px; margin-bottom: 6px; }
        .tab-btn { 
            background: #051020; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 5px 10px; cursor: pointer; font-family: 'Rajdhani'; font-size: 0.7em;
        }
        .tab-btn.active { background: var(--neon-blue); color: #000; }

        .highcharts-container, .highcharts-root { background: transparent !important; }
        
        #sidebarFrame { width: 100%; flex: 1; border: none; min-height: 0; }
        
        /* --- MAP CONTAINER (fills right panel) --- */
        #container {
            flex: 1;
            width: 100%;
            min-height: 0;
            margin: 0 auto;
        }

        /* --- MAP HEADER --- */
        .map-header {
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--neon-green);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-blue);
        }

        /* --- MOBILE --- */
        @media screen and (max-width: 1024px) {
            .dashboard-container {
                flex-direction: column !important;
                overflow-y: auto !important;
                height: auto !important;
                min-height: calc(100vh - 70px);
            }
            .archive-left-panel {
                flex: none !important;
                width: 100% !important;
                max-width: 100% !important;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
                padding: 10px;
            }
            .archive-right-panel {
                flex: 1 !important;
                min-height: 500px;
            }
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
            .weapons-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="logo-section">
            <h1>CPA: THE MAP <span style="font-size:0.5em; color:var(--text-muted); vertical-align: super;">ARCHIVES</span></h1>
        </div>
        <div class="nav-links">
            <a href="index.html">Live Map</a>
            <a href="#" class="active">Archives</a>
            <a href="https://discord.gg/cparmies" target="_blank">Discord</a>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <!-- LEFT PANEL: Controls + Stats + Tabs + Warmonger -->
        <aside class="archive-left-panel">
            
            <!-- Date Selector -->
            <div>
                <div class="panel-section-title">Select Date</div>
                <select id="weekSelector" class="archive-selector" onchange="loadWeekData(this.value)">
                    <option>Loading...</option>
                </select>
            </div>

            <!-- Stats Grid -->
            <div>
                <div class="panel-section-title">Statistics</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-val" id="totalForces">0</div>
                        <div class="stat-label">Active Forces</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalAttacks">0</div>
                        <div class="stat-label">Max Attacks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalWars">0</div>
                        <div class="stat-label">Active Wars</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="totalWeapons">0</div>
                        <div class="stat-label">Weapons Used</div>
                    </div>
                </div>
            </div>

            <!-- Weapons Grid -->
            <div>
                <div class="panel-section-title">Monthly Weapon Usage</div>
                <div id="weaponsGrid" class="weapons-grid"></div>
            </div>

            <!-- Tabs + Iframe -->
            <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
                <div class="tab-container">
                    <button class="tab-btn active" onclick="switchTab('topten')">TOP 10</button>
                    <button class="tab-btn" onclick="switchTab('forces')">FORCES</button>
                    <button class="tab-btn" onclick="switchTab('wealth')">WEALTH</button>
                </div>
                <div style="flex:1; overflow:hidden; display:flex; flex-direction:column; min-height:0;">
                    <iframe id="sidebarFrame" src=""></iframe>
                </div>
            </div>

            <!-- Warmonger -->
            <div style="padding-top:8px; border-top:1px solid var(--border-color);">
                <div style="font-size:0.75em; color:var(--text-muted); text-transform:uppercase;">Top Warmonger</div>
                <div id="warmongerName" style="font-size:1.2em; font-weight:bold; color:#ff0055;">-</div>
                <div id="warmongerCount" style="color:#fff; font-size:0.85em;">0 Attacks</div>
            </div>

        </aside>

        <!-- RIGHT PANEL: Map only (fills available space) -->
        <div class="archive-right-panel">
            <div class="map-header">
                <span class="status-indicator">
                    <div class="status-dot"></div>
                    ARCHIVED DATA: <span id="archiveDate" style="color:#fff; margin-left:5px;">-</span>
                </span>
            </div>
            <div id="container"></div>
            <div id="loadingMsg" style="display:none; text-align:center; color:#0ff; padding:20px;">LOADING MAP...</div>
        </div>

    </div>

    <div class="footer-text" style="text-align:center; padding: 10px; color: #555; font-size: 0.8rem;">
        UI by df44 for CPA
    </div>

    <script>
        let historyData = [];
        let currentBasePath = "";

        window.onload = async function() {
            try {
                const response = await fetch('history.json');
                if (!response.ok) throw new Error("History file not found");
                historyData = await response.json();

                const selector = document.getElementById('weekSelector');
                selector.innerHTML = "";
                
                if (historyData.length === 0) {
                    selector.innerHTML = "<option>No Archives Found</option>";
                    return;
                }

                historyData.forEach((week, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.innerText = `${week.id}`;
                    selector.appendChild(opt);
                });

                loadWeekData(0);

            } catch (e) {
                console.error(e);
                document.querySelector('.dashboard-container').innerHTML = 
                    `<div style="width:100%; text-align:center; padding-top:100px; color:#ff0055;">
                        <h2>ARCHIVE OFFLINE</h2>
                        <p>No history data generated yet.</p>
                    </div>`;
            }
        };

        function loadWeekData(index) {
            const week = historyData[index];
            const stats = week.stats || {};
            const monthly = week.monthly_items || {};

            // Define base path for archived files
            currentBasePath = week.folder || `archives/${week.date}`;

            // 1. Header & Stats
            document.getElementById('archiveDate').innerText = week.date || '?';

            const forcesCount = (week.active_forces || []).reduce((sum, f) => sum + (f.servers || 0), 0);
            document.getElementById('totalForces').innerText = forcesCount;
            document.getElementById('totalAttacks').innerText = stats.attacks || 0;
            document.getElementById('totalWars').innerText = stats.wars || 0;

            const totalWeapons = (monthly.bomb_used || 0) + (monthly.nuke_used || 0) + (monthly.ship_used || 0) + (monthly.plane_used || 0);
            document.getElementById('totalWeapons').innerText = totalWeapons;

            // 2. Weapons grid
            const weaponsGrid = document.getElementById('weaponsGrid');
            weaponsGrid.innerHTML = "";
            const weaponData = [
                { icon: "💣", label: "Bombs", count: monthly.bomb_used || 0 },
                { icon: "☢️", label: "Nukes", count: monthly.nuke_used || 0 },
                { icon: "🚢", label: "Ships", count: monthly.ship_used || 0 },
                { icon: "✈️", label: "Planes", count: monthly.plane_used || 0 }
            ];
            weaponData.forEach(w => {
                const card = document.createElement('div');
                card.className = "weapon-card";
                card.innerHTML = `
                    <div class="weapon-icon">${w.icon}</div>
                    <div class="weapon-count">${w.count}</div>
                    <div class="weapon-label">${w.label}</div>
                `;
                weaponsGrid.appendChild(card);
            });

            // 3. Warmonger
            document.getElementById('warmongerName').innerText = stats.warmonger_name || '-';
            document.getElementById('warmongerCount').innerText = `${stats.warmonger_count || 0} Attacks`;

            // 4. Update the active tab (iframe)
            const activeBtn = document.querySelector('.tab-btn.active');
            if (activeBtn) activeBtn.click();
            else switchTab('topten');

            // 5. Load the ARCHIVED MAP
            loadArchiveMap(currentBasePath);
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const clickedBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => 
                b.innerText.toLowerCase().includes(tabName.replace('topten', 'top 10'))
            );
            if (clickedBtn) clickedBtn.classList.add('active');

            const iframe = document.getElementById('sidebarFrame');
            if (tabName === 'topten') iframe.src = `${currentBasePath}/topten.html`;
            if (tabName === 'forces') iframe.src = `${currentBasePath}/army_code.html`;
            if (tabName === 'wealth') iframe.src = `${currentBasePath}/wealth.html`;
        }

        // Load Archived Highcharts Map
        function loadArchiveMap(basePath) {
            const container = document.getElementById('container');
            const loader = document.getElementById('loadingMsg');
            
            if (Highcharts.charts[0]) { Highcharts.charts[0].destroy(); }
            container.innerHTML = "";
            loader.style.display = 'block';

            // Update map CSS to archived version
            document.getElementById('archiveMapCss').href = `${basePath}/map.css?t=${Date.now()}`;

            // Remove old dynamic script
            const oldScript = document.getElementById('dynamicMapScript');
            if (oldScript) oldScript.remove();

            // Inject archived map.js
            const script = document.createElement('script');
            script.id = 'dynamicMapScript';
            script.src = `${basePath}/map.js?t=${Date.now()}`;
            
            script.onload = () => { loader.style.display = 'none'; };
            script.onerror = () => { 
                loader.style.display = 'none'; 
                container.innerHTML = "<div style='text-align:center; color:#ff0055; padding:40px;'>Map data not available for this archive.</div>";
            };

            document.body.appendChild(script);
        }
    </script>
</body>
</html>
